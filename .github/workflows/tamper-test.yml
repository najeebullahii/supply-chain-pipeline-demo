name: Tamper Test (Manual)

on:
  workflow_dispatch:
    inputs:
      good_image_tag:
        description: 'Tag of the legitimately signed image to tamper with'
        required: true

jobs:
  tamper-test:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::603283648579:role/github-actions-ecr-push
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Pull the legitimately signed image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: docker pull $ECR_REGISTRY/supply-chain-pipeline-demo:${{ inputs.good_image_tag }}

      - name: Tamper with the image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker run -d --name tamper-container $ECR_REGISTRY/supply-chain-pipeline-demo:${{ inputs.good_image_tag }}
          docker exec tamper-container sh -c "echo 'this should never be here' > /app/intruder.txt"
          docker commit tamper-container tampered-image:latest
          docker stop tamper-container

      - name: Push the tampered image under a new tag
        id: push-tampered
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag tampered-image:latest $ECR_REGISTRY/supply-chain-pipeline-demo:tampered-test
          docker push $ECR_REGISTRY/supply-chain-pipeline-demo:tampered-test
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $ECR_REGISTRY/supply-chain-pipeline-demo:tampered-test)
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Attempt to verify the tampered image (expected to fail)
        run: |
          cosign verify \
            --certificate-identity="https://github.com/najeebullahii/supply-chain-pipeline-demo/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ steps.push-tampered.outputs.digest }}
