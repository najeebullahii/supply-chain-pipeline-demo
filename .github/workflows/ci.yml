name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Scan filesystem with Trivy
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'

      - name: Build Docker image
        run: docker build -t supply-chain-pipeline-demo:${{ github.sha }} .

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: 'image'
          image-ref: 'supply-chain-pipeline-demo:${{ github.sha }}'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: 'supply-chain-pipeline-demo:${{ github.sha }}'
          format: spdx-json
          output-file: sbom.json

      - name: Upload SBOM as artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-report
          path: sbom.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::603283648579:role/github-actions-ecr-push
          aws-region: us-east-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push image to ECR
        id: push-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
        run: |
          docker tag supply-chain-pipeline-demo:${{ github.sha }} $ECR_REGISTRY/supply-chain-pipeline-demo:${{ github.sha }}
          docker push $ECR_REGISTRY/supply-chain-pipeline-demo:${{ github.sha }}
          DIGEST=$(docker inspect --format='{{index .RepoDigests 0}}' $ECR_REGISTRY/supply-chain-pipeline-demo:${{ github.sha }})
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.0

      - name: Sign the image with Cosign (keyless)
        run: cosign sign --yes ${{ steps.push-image.outputs.digest }}

      - name: Verify image signature
        run: |
          cosign verify \
            --certificate-identity="https://github.com/najeebullahii/supply-chain-pipeline-demo/.github/workflows/ci.yml@refs/heads/main" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            ${{ steps.push-image.outputs.digest }}

      - name: Download current task definition
        run: |
          aws ecs describe-task-definition \
            --task-definition supply-chain-pipeline-demo-task \
            --query taskDefinition > task-definition.json

      - name: Insert new image into task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: task-definition.json
          container-name: supply-chain-pipeline-demo
          image: ${{ steps.push-image.outputs.digest }}

      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: supply-chain-pipeline-demo-service
          cluster: supply-chain-pipeline-demo-cluster
          wait-for-service-stability: true